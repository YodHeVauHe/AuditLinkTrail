name: Bug report
description: Report a reproducible defect in the repository.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remove secrets, access tokens, personal data, and confidential records from all examples and logs.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the app, version, operating system, and relevant configuration.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks use
        - Major limitation
        - Minor limitation
        - Cosmetic
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact credentials, personal data, and confidential record content before posting.
